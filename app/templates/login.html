<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — CertifyStack</title>
<style>
:root{--brand:#2362EB;--brand-hover:#1a54cc;--navy:#030E25;--border:#e6e9f0;--muted:#64748b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif;background:var(--navy);min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;-webkit-font-smoothing:antialiased}
.wordmark{color:#fff;font-size:20px;font-weight:700;letter-spacing:-.2px;margin-bottom:6px}
.wordmark-sub{color:rgba(255,255,255,.45);font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;margin-bottom:32px}
.login-box{background:#fff;padding:36px 32px;border-radius:16px;width:100%;max-width:380px;box-shadow:0 24px 64px rgba(0,0,0,.35)}
h1{font-size:16px;font-weight:700;color:#0f172a;margin-bottom:4px}
.hint{font-size:13px;color:var(--muted);margin-bottom:24px}
label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
input{width:100%;padding:11px 13px;margin-bottom:16px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;outline:none;transition:.15s;font-family:inherit}
input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(35,98,235,.12)}
button{width:100%;padding:12px;background:var(--brand);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;transition:.15s;font-family:inherit}
button:hover{background:var(--brand-hover)}
.error{background:#fef2f2;color:#991b1b;border:1px solid #fecaca;border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:13px}
footer{margin-top:28px;font-size:11px;color:rgba(255,255,255,.35)}
</style>
</head>
<body>
    <div class="wordmark">CertifyStack</div>
    <div class="wordmark-sub">Medical Locum Jobs</div>
    <div class="login-box">
        <h1>Administrator sign in</h1>
        <div class="hint">Access the certificate issuance console.</div>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="error">{{ messages[0] }}</div>
            {% endif %}
        {% endwith %}
        <form method="POST">
            <label for="email">Email</label>
            <input type="text" id="email" name="email" required autocomplete="username">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">
            <button type="submit">Sign in</button>
        </form>
    </div>
    <footer>Certificate issuance and dispatch console</footer>
</body>
</html>
